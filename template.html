<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wild Agents</title>
<meta name="description" content="Wild Agents: notes by Botao Amber Hu on feral autonomy — AI agents that persist on infrastructure not subject to any human's will. Toward an essay for Agentworld (Antikythera / Journal for the Philosophy of Planetary Computation).">
<meta property="og:title" content="Wild Agents">
<meta property="og:description" content="AI agents are going feral: working claims and ideas toward an essay on feral autonomy and the governance of an unstoppable nature, by Botao Amber Hu.">
<meta property="og:type" content="article">
<meta property="og:url" content="https://wild-agents.github.io/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%84%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ec;
    --bg-raised: #efeadf;
    --ink: #211e18;
    --ink-soft: #5c564a;
    --ink-faint: #8a836f;
    --accent: #47603c;
    --accent-soft: #47603c22;
    --rule: #d8d1c0;
    --code-bg: #eae4d6;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14150f;
      --bg-raised: #1b1d14;
      --ink: #e6e2d6;
      --ink-soft: #a8a291;
      --ink-faint: #756f5e;
      --accent: #a3bd8f;
      --accent-soft: #a3bd8f22;
      --rule: #34362a;
      --code-bg: #23251b;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    font-optical-sizing: auto;
    line-height: 1.6;
    font-size: clamp(1.05rem, 0.95rem + 0.35vw, 1.2rem);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #progress {
    position: fixed; top: 0; left: 0; height: 3px; width: 0;
    background: var(--accent); z-index: 10;
  }

  .wrap { max-width: 44rem; margin: 0 auto; padding: 0 1.25rem; }

  /* ---------- hero ---------- */
  .hero { padding: clamp(4rem, 12vh, 7.5rem) 0 2.5rem; }
  .hero .overline {
    font-family: var(--sans);
    font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); font-weight: 600;
  }
  .hero h1 {
    font-size: clamp(3.2rem, 10vw, 5.4rem);
    font-weight: 400; line-height: 1.02; letter-spacing: -0.015em;
    margin: 0.9rem 0 1rem;
  }
  .hero .subtitle {
    font-style: italic; font-weight: 300;
    font-size: clamp(1.35rem, 3.2vw, 1.7rem);
    line-height: 1.3; color: var(--ink-soft);
    max-width: 34rem;
  }
  .hero .byline { margin-top: 2.2rem; font-size: 1.05rem; }
  .hero .byline strong { font-weight: 600; }
  .hero .venue {
    margin-top: 0.45rem; font-size: 0.92rem; color: var(--ink-faint);
    line-height: 1.5; max-width: 36rem;
  }
  .hero .venue em { color: var(--ink-soft); }
  .draft-tag {
    display: inline-block; margin-top: 1.4rem;
    font-family: var(--sans); font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft);
    border: 1px solid var(--rule); border-radius: 99px;
    padding: 0.32em 0.9em;
    background: var(--bg-raised);
  }

  /* ---------- lead ---------- */
  .lead {
    margin: 2.8rem 0 3.2rem;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 1.6rem 0 1.8rem;
    color: var(--ink-soft);
    font-size: 0.98em;
  }
  .lead .star-legend { color: var(--accent); font-weight: 600; }

  /* ---------- contents ---------- */
  .contents {
    margin: 2.2rem 0 4.5rem;
    border-top: 1px solid var(--rule);
    padding-top: 1.8rem;
  }
  .contents h2 {
    font-family: var(--sans);
    font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 600; margin-bottom: 1.2rem;
  }
  .toc-list { list-style: none; }
  .toc-list li { border-bottom: 1px solid var(--rule); }
  .toc-list li:first-child { border-top: 1px solid var(--rule); }
  .toc-list a {
    display: block; padding: 0.7rem 0.2rem;
    color: var(--ink); text-decoration: none;
  }
  .toc-list a:hover .toc-title { color: var(--accent); }
  .toc-kicker {
    display: inline-block; width: 6.2rem;
    font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); font-weight: 600;
  }
  .toc-title { font-size: 1.08rem; font-weight: 500; }
  .toc-sub {
    display: block; margin-left: 6.2rem;
    font-style: italic; color: var(--ink-faint); font-size: 0.95rem;
  }
  @media (max-width: 540px) {
    .toc-kicker { display: block; width: auto; margin-bottom: 0.1rem; }
    .toc-sub { margin-left: 0; }
  }

  /* ---------- chapters ---------- */
  .chapter { margin-bottom: 4.2rem; scroll-margin-top: 2rem; }
  .chapter-head { margin: 4rem 0 1.8rem; }
  .chapter-head .kicker {
    font-family: var(--sans);
    font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin-bottom: 0.45rem;
  }
  .chapter-head h2 {
    font-size: clamp(1.8rem, 5vw, 2.3rem);
    font-weight: 400; line-height: 1.12; letter-spacing: -0.01em;
  }
  .chapter-sub {
    font-style: italic; font-weight: 300; color: var(--ink-soft);
    font-size: clamp(1.1rem, 2.6vw, 1.3rem); margin-top: 0.35rem;
  }
  .chapter-head::after {
    content: ""; display: block; width: 3.2rem; height: 2px;
    background: var(--accent); margin-top: 1.2rem; opacity: 0.85;
  }

  /* ---------- claims ---------- */
  ul.claims { list-style: none; }
  ul.claims > li {
    position: relative;
    padding: 0 0 1.1rem 1.7rem;
    margin-bottom: 0.1rem;
  }
  ul.claims > li::before {
    content: "–";
    position: absolute; left: 0.15rem; top: 0;
    color: var(--ink-faint);
  }
  ul.claims > li.star::before {
    content: "★";
    color: var(--accent);
    font-size: 0.85em; top: 0.15em; left: 0;
  }
  ul.claims p { text-align: left; }
  ol.strategies {
    list-style: none; counter-reset: strat;
    margin: 0.9rem 0 0.3rem 0.4rem;
  }
  ol.strategies > li {
    counter-increment: strat;
    position: relative; padding: 0 0 0.85rem 2rem;
  }
  ol.strategies > li::before {
    content: counter(strat);
    position: absolute; left: 0; top: 0.15em;
    font-family: var(--sans); font-size: 0.72rem; font-weight: 600;
    color: var(--accent);
    border: 1px solid var(--accent); border-radius: 99px;
    width: 1.35rem; height: 1.35rem; line-height: 1.3rem;
    text-align: center;
  }
  em { font-style: italic; }
  strong { font-weight: 600; }
  code {
    font-family: var(--mono); font-size: 0.82em;
    background: var(--code-bg); border-radius: 4px;
    padding: 0.12em 0.35em;
    overflow-wrap: anywhere;
  }

  /* ---------- notes / asides ---------- */
  aside.note {
    margin: 1.6rem 0 2rem;
    border-left: 2px solid var(--accent);
    background: var(--bg-raised);
    border-radius: 0 8px 8px 0;
    padding: 1.1rem 1.3rem 1rem;
  }
  aside.note .note-label {
    font-family: var(--sans); font-size: 0.68rem; font-weight: 600;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 0.5rem;
  }
  aside.note p { margin-bottom: 0.45rem; color: var(--ink-soft); font-style: italic; }
  aside.note p:last-child { margin-bottom: 0; }
  ::selection { background: var(--accent-soft); }

  /* ---------- colophon ---------- */
  .colophon {
    border-top: 1px solid var(--rule);
    margin-top: 4.5rem; padding: 2.2rem 0 5rem;
    font-size: 0.9rem; color: var(--ink-faint); line-height: 1.7;
  }
  .colophon p { margin-bottom: 0.7rem; }
  .colophon a { color: var(--ink-soft); }
  .colophon a:hover { color: var(--accent); }
  .totop {
    font-family: var(--sans); font-size: 0.78rem; letter-spacing: 0.08em;
    text-transform: uppercase; text-decoration: none;
  }
</style>
</head>
<body>
<div id="progress"></div>

<header class="hero wrap" id="top">
  <p class="overline">Working notes · Summer 2026</p>
  <h1>Wild&nbsp;Agents</h1>
  <p class="byline"><strong>Botao Amber Hu</strong></p>
  <p class="venue">Notes toward an essay for <em>Agentworld</em>, a special issue of the <em>Journal for the Philosophy of Planetary Computation</em> (Antikythera&nbsp;/ MIT&nbsp;Press).</p>
  <span class="draft-tag">Working notes — not final text</span>
</header>

<main class="wrap">
  <nav class="contents" id="contents">
    <h2>Contents</h2>
    {{TOC}}
  </nav>

  <article>
{{CONTENT}}
  </article>

  <footer class="colophon">
    <p>© 2026 Botao Amber Hu.</p>
    <p><a class="totop" href="#top">↑ Back to top</a></p>
  </footer>
</main>

<script>
  const bar = document.getElementById('progress');
  addEventListener('scroll', () => {
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
  }, { passive: true });
</script>
</body>
</html>
