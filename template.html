<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGETITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta property="og:title" content="{{PAGETITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{URL}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%84%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ec;
    --bg-raised: #efeadf;
    --ink: #211e18;
    --ink-soft: #5c564a;
    --ink-faint: #8a836f;
    --accent: #47603c;
    --accent-soft: #47603c22;
    --rule: #d8d1c0;
    --code-bg: #eae4d6;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14150f;
      --bg-raised: #1b1d14;
      --ink: #e6e2d6;
      --ink-soft: #a8a291;
      --ink-faint: #756f5e;
      --accent: #a3bd8f;
      --accent-soft: #a3bd8f22;
      --rule: #34362a;
      --code-bg: #23251b;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    font-optical-sizing: auto;
    line-height: 1.65;
    font-size: clamp(1.05rem, 0.95rem + 0.35vw, 1.2rem);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #progress {
    position: fixed; top: 0; left: 0; height: 3px; width: 0;
    background: var(--accent); z-index: 10;
  }

  .wrap { max-width: 44rem; margin: 0 auto; padding: 0 1.25rem; }

  /* ---------- hero ---------- */
  .hero { padding: clamp(4rem, 12vh, 7.5rem) 0 2.5rem; }
  .hero .overline {
    font-family: var(--sans);
    font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); font-weight: 600;
  }
  .hero h1 {
    font-size: clamp(2.9rem, 9vw, 5.2rem);
    font-weight: 400; line-height: 1.02; letter-spacing: -0.015em;
    margin: 0.9rem 0 1rem;
  }
  .hero .subtitle {
    font-style: italic; font-weight: 300;
    font-size: clamp(1.3rem, 3.2vw, 1.65rem);
    line-height: 1.3; color: var(--ink-soft);
    max-width: 36rem;
  }
  .hero .byline { margin-top: 2.2rem; font-size: 1.05rem; }
  .hero .byline strong { font-weight: 600; }
  .hero .venue {
    margin-top: 0.45rem; font-size: 0.92rem; color: var(--ink-faint);
    line-height: 1.5; max-width: 36rem;
  }
  .hero .venue em { color: var(--ink-soft); }
  .draft-tag {
    display: inline-block; margin-top: 1.4rem;
    font-family: var(--sans); font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft);
    border: 1px solid var(--rule); border-radius: 99px;
    padding: 0.32em 0.9em;
    background: var(--bg-raised);
  }
  .xlink { margin-top: 1.6rem; }
  .xlink a {
    font-family: var(--sans); font-size: 0.85rem; font-weight: 600;
    color: var(--accent); text-decoration: none;
  }
  .xlink a:hover { text-decoration: underline; }

  /* ---------- contents ---------- */
  .contents {
    margin: 2.2rem 0 4.5rem;
    border-top: 1px solid var(--rule);
    padding-top: 1.8rem;
  }
  .contents h2 {
    font-family: var(--sans);
    font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 600; margin-bottom: 1.2rem;
  }
  .toc-list { list-style: none; }
  .toc-list > li { border-bottom: 1px solid var(--rule); }
  .toc-list > li:first-child { border-top: 1px solid var(--rule); }
  .toc-list a {
    display: block; padding: 0.65rem 0.2rem;
    color: var(--ink); text-decoration: none;
  }
  .toc-list a:hover .toc-title { color: var(--accent); }
  .toc-kicker {
    display: inline-block; width: 6.6rem;
    font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); font-weight: 600;
  }
  .toc-title { font-size: 1.06rem; font-weight: 500; }
  .toc-sub {
    display: block; margin-left: 6.6rem;
    font-style: italic; color: var(--ink-faint); font-size: 0.93rem;
  }
  .toc-nested { list-style: none; margin-left: 1.2rem; }
  .toc-nested li { border-bottom: none !important; border-top: none !important; }
  .toc-nested a { padding: 0.35rem 0.2rem; }
  @media (max-width: 560px) {
    .toc-kicker { display: block; width: auto; margin-bottom: 0.1rem; }
    .toc-sub { margin-left: 0; }
  }

  /* ---------- section heads ---------- */
  .act-head { margin: 5rem 0 0.8rem; scroll-margin-top: 2rem; }
  .act-head .kicker, .chapter-head .kicker {
    font-family: var(--sans);
    font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin-bottom: 0.45rem;
  }
  .act-head h2 {
    font-size: clamp(2rem, 6vw, 2.7rem);
    font-weight: 400; line-height: 1.1; letter-spacing: -0.01em;
  }
  .act-head::after {
    content: ""; display: block; width: 4.5rem; height: 2px;
    background: var(--accent); margin-top: 1.1rem; opacity: 0.85;
  }
  .act-epigraph {
    color: var(--ink-faint); font-size: 1.05rem;
    margin: 0.9rem 0 0;
  }
  .chapter-head { margin: 3.6rem 0 1.6rem; scroll-margin-top: 2rem; }
  .chapter-head h2 {
    font-size: clamp(1.7rem, 4.6vw, 2.15rem);
    font-weight: 400; line-height: 1.14; letter-spacing: -0.01em;
  }
  .chapter-head h3 {
    font-size: clamp(1.45rem, 3.8vw, 1.75rem);
    font-weight: 500; line-height: 1.18;
  }
  .chapter-sub {
    font-style: italic; font-weight: 300; color: var(--ink-soft);
    font-size: clamp(1.05rem, 2.4vw, 1.25rem); margin-top: 0.3rem;
  }
  article h3 {
    font-size: clamp(1.3rem, 3.2vw, 1.55rem);
    font-weight: 500; line-height: 1.25;
    margin: 2.8rem 0 1.1rem;
    scroll-margin-top: 2rem;
  }

  /* ---------- body ---------- */
  article > p, article section > p { margin-bottom: 0; text-align: justify; hyphens: auto; }
  article p + p { text-indent: 1.7em; }
  article .act-epigraph, article .chapter-sub { text-align: left; hyphens: none; text-indent: 0; }
  article blockquote, article .table-wrap, article pre { margin-top: 1.3rem; }
  #refs p { text-indent: 0; }
  em { font-style: italic; }
  strong { font-weight: 600; }
  code {
    font-family: var(--mono); font-size: 0.82em;
    background: var(--code-bg); border-radius: 4px;
    padding: 0.12em 0.35em;
    overflow-wrap: anywhere;
  }
  pre {
    background: var(--code-bg); border-radius: 8px;
    padding: 1rem 1.2rem; overflow-x: auto; margin: 1.4rem 0;
  }
  pre code { background: none; padding: 0; }
  article ul, article ol { margin: 0 0 1.35rem 1.5rem; }
  article li { margin-bottom: 0.55rem; }
  article li > ul, article li > ol { margin-top: 0.55rem; margin-bottom: 0.55rem; }
  article li::marker { color: var(--ink-faint); }
  article ol > li::marker {
    font-family: var(--sans); font-size: 0.85em; font-weight: 600;
    color: var(--accent);
  }
  article blockquote {
    border-left: 2px solid var(--accent);
    padding: 0.15rem 0 0.15rem 1.1rem;
    margin: 0.7rem 0 0.8rem; color: var(--ink-soft);
    font-style: italic;
  }
  article blockquote p { margin-bottom: 0.4rem; text-align: left; hyphens: none; }
  article blockquote p:last-child { margin-bottom: 0; }
  article hr {
    border: none; border-top: 1px solid var(--rule);
    margin: 3rem 0;
  }
  a { color: var(--accent); }
  ::selection { background: var(--accent-soft); }

  /* ---------- tables ---------- */
  .table-wrap { overflow-x: auto; margin: 1.6rem 0; }
  table {
    border-collapse: collapse; font-size: 0.88em; line-height: 1.45;
    min-width: 100%;
  }
  th {
    font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-soft); font-weight: 600;
    text-align: left;
  }
  th, td {
    border-bottom: 1px solid var(--rule);
    padding: 0.55em 0.9em 0.55em 0;
    vertical-align: top;
  }
  thead th { border-bottom: 2px solid var(--ink-faint); }

  /* ---------- citations ---------- */
  .citation a {
    color: var(--accent); text-decoration: none;
    font-family: var(--sans); font-weight: 600; font-size: 0.94em;
  }
  .citation a:hover { text-decoration: underline; }
  sup { line-height: 0; }

  /* ---------- bibliography ---------- */
  #refs { font-size: 0.92em; }
  #refs .csl-entry {
    display: flex; gap: 0.6em;
    margin-bottom: 0.75rem; text-align: left;
    scroll-margin-top: 2rem;
  }
  #refs .csl-left-margin {
    flex: 0 0 2.2em; text-align: right;
    font-family: var(--sans); font-size: 0.85em; font-weight: 600;
    color: var(--accent); padding-top: 0.15em;
  }
  #refs .csl-right-inline { flex: 1; overflow-wrap: anywhere; }

  /* ---------- side TOC (scrollspy) ---------- */
  .side-toc {
    position: fixed;
    top: 5.5rem; bottom: 3rem;
    left: max(1.4rem, calc(50vw - 22rem - 16.5rem));
    width: 14rem;
    overflow-y: auto;
    font-family: var(--sans);
    padding-right: 0.8rem;
    scrollbar-width: none;
    opacity: 0; visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s;
  }
  .side-toc.visible { opacity: 1; visibility: visible; }
  .side-toc::-webkit-scrollbar { display: none; }
  @media (max-width: 1220px) { .side-toc { display: none; } }
  .side-toc a {
    display: block;
    font-size: 0.76rem; line-height: 1.35;
    color: var(--ink-faint); text-decoration: none;
    padding: 0.28rem 0 0.28rem 0.85rem;
    border-left: 2px solid var(--rule);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .side-toc a:hover { color: var(--ink); }
  .side-toc a.st-0 {
    font-weight: 600; font-size: 0.7rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-top: 0.55rem;
  }
  .side-toc a.st-1 { padding-left: 1.7rem; }
  .side-toc a.active {
    color: var(--accent); border-left-color: var(--accent);
    font-weight: 600;
  }
  .side-toc .st-num {
    display: inline-block; min-width: 1.3em;
    margin-right: 0.35em;
    color: inherit; opacity: 0.65;
  }

  /* ---------- colophon ---------- */
  .colophon {
    border-top: 1px solid var(--rule);
    margin-top: 4.5rem; padding: 2.2rem 0 5rem;
    font-size: 0.9rem; color: var(--ink-faint); line-height: 1.7;
  }
  .colophon p { margin-bottom: 0.7rem; }
  .colophon a { color: var(--ink-soft); }
  .colophon a:hover { color: var(--accent); }
  .totop {
    font-family: var(--sans); font-size: 0.78rem; letter-spacing: 0.08em;
    text-transform: uppercase; text-decoration: none;
  }
</style>
</head>
<body>
<div id="progress"></div>

<header class="hero wrap" id="top">
{{HERO}}
</header>

<aside class="side-toc" aria-label="Sections">
{{SIDETOC}}
</aside>

<main class="wrap">
  <nav class="contents" id="contents">
    <h2>Contents</h2>
    {{TOC}}
  </nav>

  <article>
{{CONTENT}}
  </article>

  <footer class="colophon">
    <p>© 2026 Botao Amber Hu.</p>
    <p><a class="totop" href="#top">↑ Back to top</a></p>
  </footer>
</main>

<script>
  const bar = document.getElementById('progress');
  const sideToc = document.querySelector('.side-toc');
  const hero = document.querySelector('.hero');
  const spyLinks = Array.from(document.querySelectorAll('.side-toc a'));
  const spyIds = spyLinks.map(a => a.getAttribute('href').slice(1));
  let active = -1;
  function onScroll() {
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
    sideToc.classList.toggle('visible', hero.getBoundingClientRect().bottom < 100);
    let cur = -1;
    for (let i = 0; i < spyIds.length; i++) {
      const el = document.getElementById(spyIds[i]);
      if (el && el.getBoundingClientRect().top < innerHeight * 0.35) cur = i;
    }
    if (cur !== active) {
      active = cur;
      spyLinks.forEach((a, i) => a.classList.toggle('active', i === cur));
      if (cur >= 0) spyLinks[cur].scrollIntoView({ block: 'nearest' });
    }
  }
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
</script>
</body>
</html>
